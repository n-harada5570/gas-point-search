<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="地点コード検索">
<link rel="manifest" href="manifest.webmanifest">
<title>ガス配送 地点コード検索</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <div><h1>地点コード検索</h1><div class="subtitle">ガス配送用</div></div>
    <button id="settingsBtn" class="icon">⚙️</button>
  </header>
  <div class="search"><input id="searchInput" placeholder="氏名カナを入力" autocomplete="off"><button id="clearBtn">クリア</button></div>
  <div id="dataCount" class="meta">データ未登録</div><div id="updatedAt" class="meta"></div>
  <section id="results"></section>
  <section id="detail" class="hidden">
    <button id="backBtn">← 戻る</button><h2 id="detailKana"></h2>
    <div class="label">地点コード</div><div id="detailCode" class="code"></div>
    <button id="copyBtn" class="primary">地点コードをコピー</button>
    <div id="barcodeMount" class="barcode">バーコード仕様確認後にここへ実装</div>
  </section>
</main>
<div id="settingsModal" class="modal hidden"><div class="panel">
  <button id="closeSettingsBtn" class="close">×</button><h2>データ設定</h2>
  <label class="filebox">CSVを選択<input id="csvFile" type="file" accept=".csv,text/csv"></label>
  <div id="importMessage" class="message"></div>
  <div id="mappingPanel" class="hidden">
    <p>列を選択してください。</p>
    <label>氏名カナ<select id="kanaColumn"></select></label>
    <label>地点コード<select id="codeColumn"></select></label>
    <button id="applyMappingBtn" class="primary">登録</button>
  </div>
  <button id="clearDataBtn" class="danger">登録データを削除</button>
</div></div>
<script src="app.js"></script>
</body></html>
